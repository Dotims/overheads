name: Collect

on:
  schedule:
    # Not the collecting interval: that is the loop in the job below, which runs a round
    # every five minutes and cannot be dropped once it has started. This asks the schedule
    # for one thing only, that a run is queued by the time the loop reaches its six hour
    # ceiling and stops, and the concurrency group holds that run pending until then. Five
    # minutes because GitHub drops most scheduled firings under load and one has to land
    # somewhere inside a five and a half hour window.
    - cron: '*/5 * * * *'
  # So a round can be started by hand from the Actions tab.
  workflow_dispatch:

# Two purposes. A slow round must not overlap the next one and fight it over the same
# rows, and the run this queues up is the handover: GitHub keeps one pending run per group
# and starts it the moment the running one ends, so the loop below is picked up again
# within seconds of stopping rather than at the mercy of the next firing that survives.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # The loop's own ceiling is five and a half hours, so this is the backstop for a round
    # that hangs rather than the budget for the work. Six hours is where GitHub kills a job
    # outright, and being killed there loses nothing: the queued run takes over.
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A round every five minutes, driven from inside one job rather than by the schedule,
      # because the schedule does not deliver it. With `*/30` asked for, the rounds of
      # 2026-09-05 actually landed at 11:19, 13:56, 16:29, 18:30, 20:50 and 22:30: gaps of
      # two to four hours, no failures, nothing said. GitHub drops scheduled firings under
      # load and there is no setting that changes it. A job that is already running is not
      # dropped, so the interval moved in here, and the schedule above was left with the
      # one job it can still do reliably enough - queueing the next run.
      - name: Collect every five minutes
        run: |
          # Just inside the six hour ceiling, with a round's worth of room to spare.
          deadline=$(( SECONDS + 5 * 3600 + 30 * 60 ))
          round=0
          failures=0

          while true; do
            round=$(( round + 1 ))
            started=$SECONDS

            echo "::group::Round $round"
            # A failed round must not end the loop: a portal refusing once is ordinary and
            # the answer to it is the next round, five minutes away rather than half an hour.
            if pnpm collect; then
              failures=0
            else
              failures=$(( failures + 1 ))
              echo "Round $round failed ($failures in a row)."
            fi
            echo "::endgroup::"

            # Three in a row is not one portal having a moment, it is something that will
            # not fix itself in five minutes. Ending the job here is how it gets said out
            # loud - a red tick and the mail that comes with it - and it costs no
            # collecting, because the run this one queued starts within seconds and comes
            # up on a fresh runner.
            if [ "$failures" -ge 3 ]; then
              echo "Giving up after $failures failed rounds; the queued run takes over."
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then break; fi

            # Measured from the start of the round, not its end, so the cadence does not
            # drift by the length of every round. A round that overruns simply starts the
            # next one at once.
            remaining=$(( 300 - (SECONDS - started) ))
            if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Reading the total cost out of a description needs a model. Without these three
          # the round says so and carries on with the rules alone, which is how every cloud
          # round ran until now. The key is a secret; the endpoint and the model name are
          # variables, so a switch of provider is one change in the Actions tab. The pause
          # between requests defaults to twelve seconds in the collector, which is what the
          # free tier's token rate allows, so it is not set here. Three listings a round, so
          # that two hundred and eighty eight rounds a day stay inside a free day's
          # allowance, and a day that runs out anyway only costs the readings: the round
          # logs it and prices the listing by the rules instead.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Both portals. OLX used to refuse this address and the round asked for Otodom
          # alone; measured again on 2026-08-16 it answers 200 here, four times over two
          # minutes, to the same honest User-Agent we have always sent. What it still
          # refuses from here is curl, over either protocol version, so the refusal is
          # about the shape of the client rather than about us. That can come back at any
          # time, and the round is meant to fail loudly when it does: the local timer in
          # deploy/ is the standby, one systemctl command away.
          OVERHEADS_SOURCES: olx,otodom,gratka
          # With these unset a round collects and says nothing, which is how it ran until
          # now. They are set so the phone hears about a flat while the computer is off,
          # which is the entire point of collecting up here.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The owner's filters, kept as repository variables so they can be changed
          # without a commit. Blank is no bound. See .env.example for what each one means.
          NOTIFY_HIDDEN_DISTRICTS: ${{ vars.NOTIFY_HIDDEN_DISTRICTS }}
          NOTIFY_PRIVATE_ONLY: ${{ vars.NOTIFY_PRIVATE_ONLY }}
          NOTIFY_MIN_COST_PLN: ${{ vars.NOTIFY_MIN_COST_PLN }}
          NOTIFY_MAX_COST_PLN: ${{ vars.NOTIFY_MAX_COST_PLN }}
          NOTIFY_MIN_AREA_M2: ${{ vars.NOTIFY_MIN_AREA_M2 }}
          NOTIFY_MAX_AREA_M2: ${{ vars.NOTIFY_MAX_AREA_M2 }}
          NOTIFY_MIN_ROOMS: ${{ vars.NOTIFY_MIN_ROOMS }}
          NOTIFY_MAX_ROOMS: ${{ vars.NOTIFY_MAX_ROOMS }}
